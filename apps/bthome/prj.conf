# The BTHome firmware. Everything about the board -- drivers, console, UF2 output -- lives in
# conf/happypot_hw.conf, which the Matter build pulls in as well. What is left here is what only
# this build gets to decide.

# --- BLE / BTHome v2 broadcaster ---
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="HappyPot"
# Extended advertising API (bt_le_ext_adv_*). We use it with legacy PDUs so the payload update
# (set_data) doesn't stall the SoC awake until the next event, the way legacy
# bt_le_adv_update_data does.
CONFIG_BT_EXT_ADV=y

# --- Low-power UART logging ---
# Immediate mode avoids periodic log-thread wakeups in sleep; the Matter build must NOT inherit
# this (an immediate 115200 console inside the CHIP thread stalls commissioning), which is why it
# is a per-app tunable and not a board fact.
CONFIG_LOG=y
CONFIG_PRINTK=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PROCESS_THREAD=n

# With the LVGL workqueue off, the full-screen render runs on whichever thread calls
# lv_refr_now(): main (the boot splash) and the system workqueue (the measurement work). A
# 200x200 mono render + Montserrat-40 rasterization needs ~4 KB. (Default 1024 overflows -> MPU
# fault -> white panel + stuck SoC.)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=24576
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# What the boot banner calls us; the NCS default is "My Application".
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="HappyPot"
