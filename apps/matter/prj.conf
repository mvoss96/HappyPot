# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/happypot.zap"

# Device identity -- what a controller shows in its UI (Basic Information cluster). Left unset,
# every one of these falls back to a sample/test default. The serial is the same on every board
# we flash; per-device serials would need factory data, which we deliberately dropped (see
# CHIP_FACTORY_DATA_NONE below).
CONFIG_CHIP_DEVICE_VENDOR_NAME="HappyPot"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="HappyPot Soil Sensor"
CONFIG_CHIP_DEVICE_HARDWARE_VERSION=1
CONFIG_CHIP_DEVICE_HARDWARE_VERSION_STRING="rev A"
CONFIG_CHIP_DEVICE_SERIAL_NUMBER="HAPPYPOT-0001"
# The software version comes from the VERSION file, not from here.

# 0x8000 (32768), to match the example attestation provider's DAC (FFF1-8000).
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# The DK library drives the buttons and LEDs of a Nordic development kit. We have neither: one
# button, no status LEDs, and that button already belongs to Zephyr's gpio-keys + input-longpress
# drivers (src/input/button.cpp). Two owners on one pin is not a style question -- the DK library
# takes raw GPIO callbacks and *disables the pin interrupt* while it debounces, which is the same
# interrupt gpio-keys is using. Off.
CONFIG_DK_LIBRARY=n

# Bluetooth Low Energy configuration. This name is the only one actually on the air during BLE
# commissioning -- the Matter commissionable payload carries no device name.
CONFIG_BT_DEVICE_NAME="HappyPot"
CONFIG_BT_DEVICE_NAME_MAX=18

# What the Zephyr/NCS boot banner calls us.
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="HappyPot"

# How often the radio asks the router "anything for me?". We are a LIT ICD on paper, but the spec
# requires a LIT device to operate in SIT mode until some client registers via the ICD Management
# cluster, and nothing does -- so this SIT limit, not the 300 s slow-poll, is what the radio
# actually does. 15 s is the spec's ceiling and NCS's default; for a sensor that only ever
# reports, the added reachability latency costs nothing. (airInk measured ~11 mA a poll.)
CONFIG_CHIP_ICD_SIT_SLOW_POLL_LIMIT=15000

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
# Shell off (saves flash; RAM barely).
CONFIG_CHIP_LIB_SHELL=n

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Built-in example attestation provider: it ships a complete, self-consistent set -- DAC
# (FFF1/8000), PAI (FFF1), and a CD covering PID 0x8000 -- all hardcoded, no factory-data
# partition needed. With HA's enable_test_net_dcl=true the test certs are trusted.
#
# The passcode stays the well-known default 20202021 ON PURPOSE: the SPAKE2+ verifier is a
# STATIC Kconfig default that is NOT recomputed when the passcode changes, and a custom passcode
# with the stock verifier makes the commissioner's PASE check fail mid-BLE (airInk lost a day to
# exactly this). A custom passcode is a later two-liner: set CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE
# and a CONFIG_CHIP_DEVICE_SPAKE2_TEST_VERIFIER regenerated for it (spake2p.py gen-verifier).
CONFIG_CHIP_FACTORY_DATA_NONE=y

# Matter has its own bootloader choice, separate from the sysbuild one, defaulting to
# CHIP_BOOTLOADER_MCUBOOT which hard-selects IMG_MANAGER. Pick NONE -- we have no MCUboot.
CONFIG_CHIP_BOOTLOADER_NONE=y

# NFC onboarding pulls in the NFC T2T nrfxlib, but the promicro board doesn't enable the nrfx
# NFCT driver -> undefined nrfx_nfct_* at link. We commission over BLE with the QR / manual code.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# The board's drivers -- soil ADC, e-paper, LVGL, the button, the uart1 console, the UF2 output
# -- are not repeated here. They live in conf/happypot_hw.conf, shared with the BTHome firmware.
# Below is only what this build decides differently.
#
# The LVGL pool is a tuning knob, not a board fact. This build carries the pairing view, whose QR
# draw buffer is the pool's largest single allocation (airInk: 5 KB at 174 px; ours is 145 px).
# ui::log_pool() prints every view's cost at boot -- read those lines before adding a view or a
# font; running the pool dry is an MPU fault, not a graceful failure.
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# --- Stacks. RAM is what this build is short of; every kilobyte here is one the UI cannot have.
# main() only runs the CHIP task queue (AppTask::StartApp); the 200x200 render with its 40 px
# glyph rasterisation moved to HappyPot's own thread, which is sized for it in app_task.cpp.
CONFIG_MAIN_STACK_SIZE=3072
# The CHIP event loop. Our cluster writes take the stack lock from HappyPot's thread rather than
# running here, so this carries Matter's own work only.
CONFIG_CHIP_TASK_STACK_SIZE=6144

# CHIP heap. The 10 KB default cannot build the NetworkCommissioning ScanNetworks response: the
# device returns NO_MEMORY, the commissioner stalls, the fail-safe expires and the fabric is
# rolled back. Home Assistant issues ScanNetworks during commissioning. Do not "reclaim" this.
CONFIG_CHIP_MALLOC_SYS_HEAP_SIZE=40960
