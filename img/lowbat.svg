<?xml version="1.0" encoding="UTF-8"?>
<!-- Low-Battery (Stil A): liegender leerer Akku + Text "Low Battery", 200x200, schwarz auf weiss -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"
     viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- Akku-Korpus: Umriss, Linienstaerke 8 (Aussenkante 24..156 / 52..120) -->
  <rect x="28" y="56" width="124" height="60" shape-rendering="crispEdges"
        fill="none" stroke="#000000" stroke-width="8"/>
  <!-- Pluspol rechts -->
  <rect x="156" y="74" width="14" height="24" fill="#000000" shape-rendering="crispEdges"/>
  <!-- Text -->
  <text x="100" y="162" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="28"
        font-weight="bold" fill="#000000">Low Battery</text>
</svg>
