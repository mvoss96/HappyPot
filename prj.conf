CONFIG_GPIO=y
CONFIG_ADC=y

# Serial off (USB CDC ACM is the board default backend — disable it explicitly)
CONFIG_SERIAL=n
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Logging via RTT
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Step 2: e-paper display ---
# Note: regulator-boot-on is OFF in app.overlay, so the 3V3 rail stays down
# until we explicitly enable it. We still need REGULATOR for that API.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Device-level power management — lets us suspend the SSD1681 and SAADC
# between operations.
CONFIG_PM_DEVICE=y

CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
# Use the vendored SSD16XX driver in src/drivers/ instead of the in-tree one
# (the project's copy adds PM_DEVICE / deep-sleep support).
CONFIG_SSD16XX=n

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
# SSD1681 only does full panel refresh; render the whole framebuffer every flush.
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=8192
# LVGL drives refreshes from its own workqueue thread. We bracket the panel
# with PM resume/suspend via display events (LV_EVENT_RENDER_START/READY) in
# display_ui.cpp, so the SSD1681 still goes to deep sleep between refreshes.
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
# Fonts used by display_ui.cpp.
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_40=y

CONFIG_HEAP_MEM_POOL_SIZE=24576
