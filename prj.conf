CONFIG_GPIO=y
CONFIG_ADC=y

# Low-power UART logging mode:
# - keep UART log output
# - disable console/shell paths
# - immediate mode avoids periodic log-thread wakeups in sleep
CONFIG_SERIAL=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=n
CONFIG_LOG=y
CONFIG_PRINTK=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xada52840"

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Step 2: e-paper display ---
# Note: regulator-boot-on is OFF in app.overlay, so the 3V3 rail stays down
# until we explicitly enable it. We still need REGULATOR for that API.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Device-level power management — lets us suspend the SSD1681 and SAADC
# between operations.
CONFIG_PM_DEVICE=y

CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
# Use the vendored SSD16XX driver in src/drivers/ instead of the in-tree one
# (the project's copy adds PM_DEVICE / deep-sleep support).
CONFIG_SSD16XX=n

# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
# SSD1681 only does full panel refresh; render the whole framebuffer every flush.
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=8192
# LVGL is driven on demand: we call lv_refr_now() from display_ui.cpp only when
# a reading actually changes the screen. The workqueue runner is OFF because it
# self-reschedules at CONFIG_LV_DEF_REFR_PERIOD (33 ms) forever, waking the SoC
# ~30x/s even on a static panel. With it off, nothing schedules LVGL between
# readings so the CPU sleeps the full measurement interval. The panel is powered
# continuously (see app.overlay) and the SSD16XX driver gates its own booster
# per refresh, so no per-refresh PM bracketing is needed here.
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
# With the LVGL workqueue off, the full-screen render runs on whichever thread
# calls lv_refr_now(): main (ui_init splash) and the system workqueue (the
# measurement work -> ui_show_reading). A 200x200 mono render + Montserrat-40
# rasterization needs ~4 KB, so size both to match the old LVGL workqueue stack.
# (Default 1024 overflows -> MPU fault -> white panel + stuck SoC.)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Fonts used by display_ui.cpp.
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_40=y

CONFIG_HEAP_MEM_POOL_SIZE=24576

# --- BLE / BTHome v2 broadcaster ---
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="HappyPot"
# Extended advertising API (bt_le_ext_adv_*). We use it with legacy PDUs so the
# payload update (set_data) doesn't stall the SoC awake until the next event,
# the way legacy bt_le_adv_update_data does.
CONFIG_BT_EXT_ADV=y
