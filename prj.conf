CONFIG_GPIO=y
CONFIG_ADC=y

# Serial off (USB CDC ACM is the board default backend — disable it explicitly)
CONFIG_SERIAL=n
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# Logging via RTT
CONFIG_CONSOLE=y
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y

# --- Step 2: e-paper display ---
# Note: regulator-boot-on is OFF in app.overlay, so the 3V3 rail stays down
# until we explicitly enable it. We still need REGULATOR for that API.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Device-level power management — lets us suspend the SSD1681 between refreshes
CONFIG_PM_DEVICE=y

CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
# Use the vendored SSD16XX driver in src/drivers/ instead of the in-tree one
# (the project's copy adds PM_DEVICE / deep-sleep support).
CONFIG_SSD16XX=n

CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
