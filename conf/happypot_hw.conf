# HappyPot's hardware, shared by both builds: the BTHome firmware and the Matter build.
# Both prj.conf files pull this in (see the EXTRA_CONF_FILE line in their CMakeLists.txt), so
# a driver that gets enabled here reaches both -- the same reason dts/happypot_hw.dtsi exists.
#
# What belongs here: facts about the board. What does NOT: anything an app might legitimately
# want a different value for -- the LVGL pool, the stacks, the heaps, the logging mode. Those are
# tuning knobs and they differ (the Matter build is short of RAM in a way the BTHome one is not,
# and immediate-mode logging would stall CHIP), so they stay in each prj.conf. Keeping this file
# free of them is what makes the merge order irrelevant.

# Build the app as C++.
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# GPIO for the soil probe's power gate (P0.17) and the button (P1.04).
CONFIG_GPIO=y

# The button, via the input subsystem. gpio-keys debounces and reports press/release; the
# input-longpress pseudo-device (in the .dtsi) splits that into a tap and a hold code, so
# button.cpp maps codes instead of timing the press itself. SYNCHRONOUS mode runs our callback
# in the reporting context rather than spending a 1 KB stack on a dedicated thread -- the
# callback only enqueues.
CONFIG_INPUT=y
CONFIG_INPUT_LONGPRESS=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

# Soil probe + battery sensing via SAADC: AIN7 (P0.31) and the internal VDDH/5 path.
CONFIG_ADC=y

# Device-level power management -- lets the drivers suspend the SSD1681, SAADC and console UART
# between operations.
CONFIG_PM_DEVICE=y

# Bound the image by the code partition (dts/happypot_flash.dtsi: 0x1000 + 0xEB000). Without a
# size the linker's FLASH region is "0x1000 to the end of the chip": it does not know that the
# settings NVS sits at 0xEC000 and the UF2 bootloader at 0xF4000, so an image that outgrew the
# partition would be written straight over the stored calibration (and, in the Matter build, the
# fabrics) and then over the bootloader -- silently, with no build error. With the size set, the
# build fails loudly instead.
#
# CONFIG_USE_DT_CODE_PARTITION=y would derive offset and size from the devicetree and is the
# tidier switch, but it is incompatible with UF2 output in Zephyr 4.4: it hides the
# FLASH_LOAD_OFFSET prompt, promptless symbols are not written to .config, and the post-build
# uf2conv.py step dies on the empty value. So the offset stays board-provided (the plain
# promicro_nrf52840 sets 0x1000) and only the size is stated. Keep it in step with the map.
CONFIG_FLASH_LOAD_SIZE=0xEB000

# Persistent settings (src/prefs.cpp), in the "storage" partition of the map above -- 0xEC000,
# 32 KB, safely below the bootloader. The Matter build brings all of this for its fabrics anyway;
# sharing the subsystem (instead of a raw nvs_mount) is what lets one partition serve both.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- E-Paper: WeAct Studio 1.54" 200x200 (SSD1681) ---
# The vendored copy in src/drivers/ adds PM_DEVICE deep-sleep support the in-tree driver lacks,
# so the in-tree one stays out.
#
# Which is why the build says, and is meant to say:
#   CMake Warning: No SOURCES given to Zephyr library: drivers__display
# DISPLAY=y brings in the display API and LVGL's binding to it; the driver behind that API is
# ours, compiled into the application. Nothing is missing.
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_SSD16XX=n

# The 3V3 display rail (regulator-fixed on P0.13). REGULATOR is the API that drives it.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# --- LVGL: 1-bit, rendered on demand, never from a workqueue ---
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_Z_COLOR_MONO_HW_INVERSION=y
# LVGL compiles a software blend routine per colour format, all of them "default y" -- and on a
# panel that knows one bit per pixel, the colour ones are among the largest code symbols in the
# whole image. Most can never be reached and are dropped.
#
# ARGB8888 is the exception, and it is NOT optional -- however obviously useless it looks on a
# mono panel. lv_bin_decoder expands every indexed image -- and all of ours are I1 -- to ARGB8888
# before it reaches the blender, palette and all. Without the blender for it, the draw falls into
# its default case, logs at WARN (off by default) and draws nothing at all: airInk lost its
# status icons to exactly this. The alpha/luminance formats A8, L8, AL88 and I1 stay too: LVGL
# may reach for them when it rasterises glyphs and masks.
CONFIG_LV_DRAW_SW_SUPPORT_RGB565=n
CONFIG_LV_DRAW_SW_SUPPORT_RGB565_SWAPPED=n
CONFIG_LV_DRAW_SW_SUPPORT_RGB565A8=n
CONFIG_LV_DRAW_SW_SUPPORT_RGB888=n
CONFIG_LV_DRAW_SW_SUPPORT_XRGB8888=n
CONFIG_LV_DRAW_SW_SUPPORT_ARGB8888_PREMULTIPLIED=n
# SSD1681 only does full panel refresh; render the whole framebuffer every flush.
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100
# LVGL is driven on demand: display_ui.cpp calls lv_refr_now() only when a reading actually
# changes the screen. The workqueue runner is OFF because it self-reschedules at
# CONFIG_LV_DEF_REFR_PERIOD (33 ms) forever, waking the SoC ~30x/s even on a static panel.
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n
# The UI fonts are generated 1bpp Montserrat subsets in src/fonts/ (strong-autohinted for the
# 1-bit panel; the built-ins are 4bpp and their antialiasing just thresholds away). LVGL still
# insists on a built-in default font -- used only by a widget that sets none, which never
# happens here -- so pick the tiny UNSCII-8 placeholder and force Montserrat out (airInk's
# rule).
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_FONT_MONTSERRAT_14=n
# Lets ui::log_pool() weigh the LVGL pool. Without a number, "8 KB should be enough" is a guess
# -- and running the pool dry is an MPU fault, not a graceful failure.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# The onboarding QR code (ui::show_pairing). lv_qrcode renders into an I1 draw buffer, which is
# this panel's own format. It is here rather than in the Matter app's prj.conf because the UI is
# shared source: whether a build shows a QR is decided by whether it has codes to show, not by a
# compile switch. A build with no radio never builds the view, so it pays only the library's
# flash -- a few KB.
CONFIG_LV_USE_QRCODE=y

# --- Console on uart1 (TX-only on P1.06), not the board's USB CDC ACM default ---
# CDC keeps the USB peripheral powered. Turning the backend off also drops the USB device stack
# from the boot path -- but it removes the SERIAL/CONSOLE/UART_CONSOLE defaults with it, so those
# have to be set explicitly here. uart0 is disabled outright: its default pins P0.09/P0.10 are
# the display's DC/CS (see dts/happypot_hw.dtsi).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n

# Produce a .uf2 for the Adafruit nRF52 bootloader these SuperMini clones ship with. Build for
# the PLAIN target (promicro_nrf52840/nrf52840), NOT the /uf2 variant: the plain target links the
# app at 0x1000 (right after the MBR), which is where this bootloader expects a SoftDevice-less
# app. The /uf2 variant links at 0x26000 (SoftDevice layout) and will not boot here.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0xada52840"
