# The silent build: the same firmware with its voice removed. Optional, opt-in on the command
# line, for either app:
#
#   west build -b promicro_nrf52840/nrf52840 apps/matter -d <dir> \
#       -- -Dmatter_EXTRA_CONF_FILE=<abs>/conf/release.conf
#
# (the `matter_` prefix is how sysbuild routes the variable to the image rather than to itself;
# the bthome build is not under sysbuild and takes a plain -DEXTRA_CONF_FILE=<abs>.)
#
# What it buys is flash (the log strings and the logging subsystem) and the last few uA of the
# console. Debugging a board flashed with this: there is no console, not even the Zephyr boot
# banner. Build without this fragment.

CONFIG_LOG=n

CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

# CONFIG_PRINTK=n alone does nothing: a `select` cannot be overridden by an assignment, and there
# are TWO boot banners that select it -- Zephyr's own, and NCS's on top of it. Both default to y.
# Neither has anywhere to print to once the console is gone.
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n
